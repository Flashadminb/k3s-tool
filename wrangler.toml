# Cloudflare Worker that serves IDATA TOOLS behind a login (see worker/index.js).
# Deployed by .github/workflows/pages.yml through scripts/cf-deploy.mjs, which fills in the KV namespace id.
name = "idata-tools"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "site"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "DB"
id = "00000000000000000000000000000000"

[triggers]
crons = ["0 * * * *"]
