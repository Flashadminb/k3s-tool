name: Deploy
# With the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets set, the site goes to Cloudflare
# behind the login (worker/index.js). Without them it is published on GitHub Pages as before (no login).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      cf: ${{ steps.t.outputs.cf }}
    steps:
      - id: t
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$CF" ]; then echo "cf=yes" >> "$GITHUB_OUTPUT"; else echo "cf=no" >> "$GITHUB_OUTPUT"; fi

  cloudflare:
    needs: target
    if: needs.target.outputs.cf == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/build-preview.mjs
      - run: node scripts/make-site.mjs
      - run: node scripts/cf-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IDT_SETUP_CODE: ${{ secrets.IDT_SETUP_CODE }}

  # The old public address stays up for now only to carry each browser's ADB keys to the login site (move button);
  # turn it off in Settings > Pages once every computer and phone has moved.
  pages:
    needs: target
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/build-preview.mjs
      - run: node scripts/make-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
